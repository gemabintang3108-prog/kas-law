<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Kas — Tabungan Harian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral+SC:wght@600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1EAD6;
    --paper-line: #D9CBA5;
    --ink: #1E2A44;
    --ink-soft: #4A5670;
    --stamp-green: #2E6F40;
    --stamp-green-dark: #1F4E2C;
    --stamp-red: #A6432B;
    --gold: #B98B2E;
    --card: #FBF7EC;
    --shadow: rgba(30,42,68,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px;
    background-color: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    padding: 0 0 60px;
    min-height:100vh;
  }
  .wrap{ max-width: 620px; margin: 0 auto; padding: 22px 18px 0; }

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    border-bottom: 3px double var(--ink);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  header h1{ font-family:'Spectral', serif; font-weight:700; font-size: 28px; margin:0; letter-spacing:0.3px; }
  header .eyebrow{ font-size:11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--ink-soft); margin-bottom:4px; }
  header .no{ font-size:12px; color:var(--ink-soft); text-align:right; }

  .datebar{
    display:flex; align-items:center; gap:8px;
    background: var(--card); border:1px solid var(--paper-line); border-radius:10px;
    padding:10px 12px; margin-bottom:16px; box-shadow: 0 2px 0 var(--shadow);
  }
  .datebar button{ width:34px;height:34px;border-radius:8px;border:1px solid var(--paper-line); background:#fff; color:var(--ink); font-size:16px; cursor:pointer; font-family:inherit; }
  .datebar button:active{ transform: translateY(1px); }
  .datebar input[type=date]{ flex:1; border:none; background:transparent; font-family:'IBM Plex Mono', monospace; font-size:15px; color:var(--ink); text-align:center; padding:6px; }
  .datebar .today-btn{ font-size:11px; padding:6px 10px; width:auto; white-space:nowrap; }

  .summary{ display:flex; gap:10px; margin-bottom:20px; }
  .summary .box{ flex:1; background:var(--card); border:1px solid var(--paper-line); border-radius:10px; padding:12px 14px; box-shadow: 0 2px 0 var(--shadow); }
  .summary .label{ font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); }
  .summary .value{ font-family:'Spectral',serif; font-weight:700; font-size:20px; margin-top:3px; color:var(--ink); }
  .summary .value.gold{ color:var(--gold); }

  .section-title{
    font-family:'Spectral SC', serif; font-size:13px; letter-spacing:2px; text-transform:uppercase;
    color:var(--ink-soft); margin: 26px 0 10px; display:flex; align-items:center; gap:10px;
  }
  .section-title::after{ content:""; flex:1; height:1px; background:var(--paper-line); }

  .addrow{ display:flex; gap:8px; margin-bottom:14px; }
  .addrow input{ flex:1; padding:11px 12px; border-radius:9px; border:1px solid var(--paper-line); font-family:'IBM Plex Mono',monospace; font-size:14px; background:#fff; color:var(--ink); }
  .addrow button{ padding:0 16px; border-radius:9px; border:none; background:var(--ink); color:var(--paper); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; cursor:pointer; }

  .members{ display:flex; flex-direction:column; gap:8px; }
  .member-row{ display:flex; align-items:center; gap:12px; background: var(--card); border:1px solid var(--paper-line); border-radius:10px; padding:10px 12px; box-shadow: 0 2px 0 var(--shadow); }
  .member-row .name{ flex:1; font-size:14.5px; }
  .member-row .del{ background:none; border:none; color:#b0a385; font-size:16px; cursor:pointer; padding:2px 6px; }

  .stampbox{
    position:relative; width:52px; height:52px; flex-shrink:0; border-radius:9px; border:2px solid var(--paper-line);
    background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: border-color .15s, background .15s;
  }
  .stampbox.paid{ border-color: var(--stamp-green); background: #E7F1E4; }
  .stampbox .mark{
    font-family:'Spectral SC', serif; font-size: 9.5px; font-weight:700; letter-spacing:0.5px;
    color: var(--stamp-green-dark); border: 2px solid var(--stamp-green-dark); border-radius:50%;
    width:44px; height:44px; display:flex; align-items:center; justify-content:center; text-align:center;
    transform: rotate(-11deg) scale(0.4); opacity:0;
    transition: transform .22s cubic-bezier(.34,1.56,.64,1), opacity .18s; line-height:1.1;
  }
  .stampbox.paid .mark{ transform: rotate(-11deg) scale(1); opacity:1; }
  .stampbox:active{ transform: scale(0.96); }

  .empty{ text-align:center; color:var(--ink-soft); font-size:13px; padding:26px 10px; border:1px dashed var(--paper-line); border-radius:10px; background:var(--card); }

  .history{ overflow-x:auto; border:1px solid var(--paper-line); border-radius:10px; background:var(--card); }
  table{ border-collapse:collapse; width:100%; font-size:12px; }
  th,td{ padding:8px 9px; text-align:center; white-space:nowrap; border-bottom:1px solid var(--paper-line); }
  th{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink-soft); font-size:10.5px; }
  td.name-col, th.name-col{ text-align:left; position:sticky; left:0; background:var(--card); font-weight:600; }
  .dot{ width:14px; height:14px; border-radius:4px; display:inline-block; border:1.5px solid var(--paper-line); }
  .dot.on{ background:var(--stamp-green); border-color:var(--stamp-green-dark); }

  .settings{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-soft); margin-top:6px; }
  .settings input{ width:90px; padding:6px 8px; border-radius:7px; border:1px solid var(--paper-line); font-family:'IBM Plex Mono',monospace; font-size:13px; background:#fff; color:var(--ink); }

  .status{ font-size:11px; color:var(--ink-soft); text-align:center; margin-top:10px; min-height:14px; }
  .reset-link{ text-align:center; margin-top:34px; }
  .reset-link button{ background:none; border:none; color:#b0522f; font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; font-family:'IBM Plex Mono',monospace; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">Buku Kas Bersama</div>
      <h1>Tabungan Harian</h1>
    </div>
    <div class="no">No. Rek —<br><span id="todayLabel"></span></div>
  </header>

  <div class="datebar">
    <button id="prevDay">‹</button>
    <input type="date" id="dateInput">
    <button id="nextDay">›</button>
    <button class="today-btn" id="gotoToday">Hari ini</button>
  </div>

  <div class="summary">
    <div class="box"><div class="label">Setor hari ini</div><div class="value" id="paidToday">0 / 0</div></div>
    <div class="box"><div class="label">Terkumpul hari ini</div><div class="value gold" id="totalToday">Rp 0</div></div>
    <div class="box"><div class="label">Total kas</div><div class="value gold" id="totalAll">Rp 0</div></div>
  </div>

  <div class="section-title">Anggota</div>
  <div class="addrow">
    <input type="text" id="nameInput" placeholder="Nama anggota baru...">
    <button id="addBtn">Tambah</button>
  </div>
  <div class="settings">Setoran per hari: Rp <input type="number" id="nominalInput" step="500" min="0"></div>

  <div class="members" id="membersList" style="margin-top:14px;"></div>
  <div class="empty" id="emptyState" style="display:none;">Belum ada anggota. Tambahkan nama di atas untuk mulai mencatat.</div>

  <div class="section-title">Riwayat (14 hari terakhir)</div>
  <div class="history"><table id="historyTable"></table></div>

  <div class="status" id="status"></div>
  <div class="reset-link"><button id="resetBtn">Hapus semua data</button></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBQwKb5BgWywX3bx3gKjNJsugJ1sUBr4X4",
  authDomain: "absen-dzuhur.firebaseapp.com",
  databaseURL: "https://absen-dzuhur-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "absen-dzuhur",
  storageBucket: "absen-dzuhur.firebasestorage.app",
  messagingSenderId: "254784143918",
  appId: "1:254784143918:web:5d9769d58fced6a0b015bf"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const kasRef = db.ref('kasHarian');

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2,'0');
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDateStr = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const rupiah = (n) => 'Rp ' + n.toLocaleString('id-ID');

let state = { members: {}, nominal: 5000, records: {} }; // members: {id: name}
let currentDate = toDateStr(new Date());

function setStatus(msg, isErr){
  $('status').textContent = msg;
  $('status').style.color = isErr ? '#a6432b' : 'var(--ink-soft)';
  if(msg) setTimeout(()=>{ if($('status').textContent===msg) $('status').textContent=''; }, 2200);
}

// realtime listener — semua perangkat yang buka halaman ini akan otomatis ter-update
setStatus('Menyambungkan ke database...');
kasRef.on('value', (snap)=>{
  const val = snap.val() || {};
  state.members = val.members || {};
  state.nominal = (val.nominal !== undefined) ? val.nominal : 5000;
  state.records = val.records || {};
  setStatus('');
  render();
}, (err)=>{
  setStatus('Gagal konek ke database: ' + err.message, true);
});

function last14Dates(){
  const dates = new Set(Object.keys(state.records));
  dates.add(currentDate);
  return Array.from(dates).sort().reverse().slice(0,14).sort();
}

function render(){
  $('dateInput').value = currentDate;
  const d = parseDateStr(currentDate);
  $('todayLabel').textContent = d.toLocaleDateString('id-ID', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
  $('nominalInput').value = state.nominal;

  const memberIds = Object.keys(state.members);
  const list = $('membersList');
  list.innerHTML = '';
  $('emptyState').style.display = memberIds.length ? 'none' : 'block';
  const todayRecord = state.records[currentDate] || {};

  memberIds.forEach((id) => {
    const name = state.members[id];
    const paid = !!todayRecord[id];
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML = `
      <div class="stampbox ${paid ? 'paid' : ''}" data-id="${id}">
        <div class="mark">LUNAS</div>
      </div>
      <div class="name">${name}</div>
      <button class="del" data-id="${id}" data-name="${name}">✕</button>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('.stampbox').forEach(el=>{
    el.addEventListener('click', ()=> togglePaid(el.dataset.id));
  });
  list.querySelectorAll('.del').forEach(el=>{
    el.addEventListener('click', ()=> removeMember(el.dataset.id, el.dataset.name));
  });

  const paidCount = memberIds.filter(id => todayRecord[id]).length;
  $('paidToday').textContent = `${paidCount} / ${memberIds.length}`;
  $('totalToday').textContent = rupiah(paidCount * state.nominal);

  let grandTotal = 0;
  Object.values(state.records).forEach(rec=>{
    grandTotal += Object.values(rec).filter(Boolean).length * state.nominal;
  });
  $('totalAll').textContent = rupiah(grandTotal);

  renderHistory(memberIds);
}

function renderHistory(memberIds){
  const dates = last14Dates();
  const table = $('historyTable');
  if(!memberIds.length){ table.innerHTML = ''; return; }

  let thead = '<thead><tr><th class="name-col">Nama</th>' +
    dates.map(ds=>{ const d = parseDateStr(ds); return `<th>${pad(d.getDate())}/${pad(d.getMonth()+1)}</th>`; }).join('') +
    '</tr></thead>';

  let tbody = '<tbody>' + memberIds.map(id=>{
    const name = state.members[id];
    const cells = dates.map(ds=>{
      const on = !!(state.records[ds] && state.records[ds][id]);
      return `<td><span class="dot ${on?'on':''}"></span></td>`;
    }).join('');
    return `<tr><td class="name-col">${name}</td>${cells}</tr>`;
  }).join('') + '</tbody>';

  table.innerHTML = thead + tbody;
}

function togglePaid(id){
  const path = `records/${currentDate}/${id}`;
  const isPaid = !!(state.records[currentDate] && state.records[currentDate][id]);
  kasRef.child(path).set(!isPaid).catch(()=> setStatus('Gagal menyimpan, coba lagi.', true));
}

function removeMember(id, name){
  if(!confirm(`Hapus ${name} dari daftar anggota? Riwayat setoran tetap tersimpan.`)) return;
  kasRef.child(`members/${id}`).remove().catch(()=> setStatus('Gagal menghapus, coba lagi.', true));
}

$('addBtn').addEventListener('click', ()=>{
  const val = $('nameInput').value.trim();
  if(!val) return;
  if(Object.values(state.members).includes(val)){ setStatus('Nama sudah ada.', true); return; }
  const newRef = kasRef.child('members').push();
  newRef.set(val).catch(()=> setStatus('Gagal menambah, coba lagi.', true));
  $('nameInput').value = '';
});
$('nameInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') $('addBtn').click(); });

$('nominalInput').addEventListener('change', ()=>{
  const v = parseInt($('nominalInput').value, 10);
  kasRef.child('nominal').set(isNaN(v) ? 0 : v).catch(()=> setStatus('Gagal menyimpan, coba lagi.', true));
});

$('dateInput').addEventListener('change', ()=>{
  currentDate = $('dateInput').value || toDateStr(new Date());
  render();
});
$('prevDay').addEventListener('click', ()=>{
  const d = parseDateStr(currentDate); d.setDate(d.getDate()-1);
  currentDate = toDateStr(d); render();
});
$('nextDay').addEventListener('click', ()=>{
  const d = parseDateStr(currentDate); d.setDate(d.getDate()+1);
  currentDate = toDateStr(d); render();
});
$('gotoToday').addEventListener('click', ()=>{ currentDate = toDateStr(new Date()); render(); });

$('resetBtn').addEventListener('click', ()=>{
  if(!confirm('Yakin hapus SEMUA data kas (anggota & riwayat)? Tindakan ini tidak bisa dibatalkan.')) return;
  kasRef.set(null).catch(()=> setStatus('Gagal menghapus, coba lagi.', true));
});
</script>
</body>
</html>
